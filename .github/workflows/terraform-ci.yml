name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      destructive_test:
        description: "Test destructive-plan blocker"
        required: false
        type: boolean
        default: false

      rollback_test:
        description: "Force Dev deployment health failure to verify automatic rollback"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/gitleaks.toml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Run Trivy Terraform Scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: "HIGH,CRITICAL"


  app-ci:
    name: Application CI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application tests
        working-directory: app
        run: pytest -v

      - name: Build Docker image
        run: |
          docker build \
            -t lawal-cloud-platform:${{ github.sha }} \
            ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: lawal-cloud-platform:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Verify container runs as non-root
        run: |
          USER_ID=$(docker run --rm \
            --entrypoint id \
            lawal-cloud-platform:${{ github.sha }} \
            -u)

          echo "Container UID: ${USER_ID}"

          if [ "${USER_ID}" = "0" ]; then
            echo "ERROR: Container is running as root."
            exit 1
          fi

          echo "PASS: Container runs as a non-root user."


  publish-image:
    name: Publish Application Image
    runs-on: ubuntu-latest
    needs: app-ci

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.environment == 'dev')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISH_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ vars.GAR_LOCATION }}-docker.pkg.dev \
            --quiet

      - name: Build and tag application image
        run: |
          IMAGE="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}"

          docker build \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            ./app

      - name: Push application image
        run: |
          IMAGE="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}"

          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"


  deploy-dev:
    name: Deploy Application to Dev
    runs-on: ubuntu-latest
    needs:
      - publish-image
      - dev-plan
      - dev-apply

    if: >
      always() &&
      needs.publish-image.result == 'success' &&
      needs.dev-plan.result == 'success' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/main' &&
         needs.dev-plan.outputs.has_changes == 'false') ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' &&
         inputs.environment == 'dev' &&
         needs.dev-apply.result == 'success')
      )

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - name: Deploy exact image to Dev VM
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}:${{ github.sha }}"

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          gcloud compute ssh terraform-devops-vm \
            --zone=europe-west2-a \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="
              set -e

              echo '${ACCESS_TOKEN}' | sudo docker login \
                -u oauth2accesstoken \
                --password-stdin \
                https://${{ vars.GAR_LOCATION }}-docker.pkg.dev

              PREVIOUS_IMAGE=\$(sudo docker inspect \
                --format='{{.Config.Image}}' \
                lawal-cloud-platform 2>/dev/null || true)

              echo \"Previous image: \${PREVIOUS_IMAGE:-none}\"
              echo \"Deploying image: ${IMAGE}\"

              sudo docker pull '${IMAGE}'

              sudo docker rm -f lawal-cloud-platform 2>/dev/null || true

              sudo docker run -d \
                --name lawal-cloud-platform \
                --restart unless-stopped \
                -p 8080:8080 \
                -e APP_ENV=development \
                -e APP_VERSION='${{ github.sha }}' \
                '${IMAGE}'

              sleep 10

              if [ '${{ inputs.rollback_test }}' != 'true' ] && curl -fsS http://localhost:8080/health; then
                echo
                echo 'Deployment health check passed.'
              else
                echo 'Deployment health check failed.'

                sudo docker logs lawal-cloud-platform || true
                sudo docker rm -f lawal-cloud-platform || true

                if [ -n \"\${PREVIOUS_IMAGE}\" ]; then
                  echo \"Rolling back to \${PREVIOUS_IMAGE}\"

                  sudo docker run -d \
                    --name lawal-cloud-platform \
                    --restart unless-stopped \
                    -p 8080:8080 \
                    -e APP_ENV=development \
                    -e APP_VERSION=rollback \
                    \"\${PREVIOUS_IMAGE}\"
                fi

                exit 1
              fi
            "

      - name: Verify deployed application
        run: |
          gcloud compute ssh terraform-devops-vm \
            --zone=europe-west2-a \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --quiet \
            --command="
              set -e

              echo 'Health endpoint:'
              curl -fsS http://localhost:8080/health
              echo

              echo 'Version endpoint:'
              curl -fsS http://localhost:8080/version
              echo

              DEPLOYED_VERSION=\$(curl -fsS http://localhost:8080/version | grep -o '${{ github.sha }}')

              if [ \"\${DEPLOYED_VERSION}\" != '${{ github.sha }}' ]; then
                echo 'ERROR: Deployed version does not match GitHub SHA.'
                exit 1
              fi

              echo 'PASS: Deployed application matches GitHub SHA.'
            "

      - name: Record deployment summary
        run: |
          {
            echo "## Dev Deployment"
            echo ""
            echo "- Environment: development"
            echo "- VM: terraform-devops-vm"
            echo "- Image SHA: \`${{ github.sha }}\`"
            echo "- Registry: \`${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/${{ vars.APP_IMAGE_NAME }}\`"
            echo "- Status: successful"
          } >> "$GITHUB_STEP_SUMMARY"

  dev-plan:
    name: Terraform Dev Plan
    runs-on: ubuntu-latest
    needs: terraform-checks

    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    if: >
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.environment == 'dev')

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_environment: dev
      TF_VAR_instance_name: terraform-devops-vm
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Dev Workspace
        run: terraform workspace select default

      - name: Terraform Dev Plan
        id: plan
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -detailed-exitcode \
            -out=dev.tfplan

          EXIT_CODE=$?
          set -e

          case "$EXIT_CODE" in
            0)
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "No infrastructure changes detected."
              ;;
            2)
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Infrastructure changes detected."
              ;;
            *)
              echo "Terraform plan failed with exit code $EXIT_CODE."
              exit "$EXIT_CODE"
              ;;
          esac

      - name: Record infrastructure deployment gate
        if: github.event_name == 'push' && steps.plan.outputs.has_changes == 'true'
        run: |
          {
            echo "## Infrastructure Deployment Gate"
            echo ""
            echo "Terraform detected infrastructure changes."
            echo ""
            echo "Automatic application deployment is blocked until the Dev Terraform Apply succeeds."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Dev Plan
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: dev.tfplan
          retention-days: 1

  staging-plan:
    name: Terraform Staging Plan
    runs-on: ubuntu-latest
    needs: terraform-checks

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'staging'

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_WORKSPACE: staging
      TF_VAR_environment: staging
      TF_VAR_instance_name: terraform-staging-vm
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Staging Plan
        run: |
          terraform plan             -input=false             -no-color             -lock-timeout=5m             -var-file=staging.tfvars             -out=staging.tfplan

      - name: Show Staging Plan Summary
        run: |
          echo "## Terraform Staging Plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          terraform show -no-color staging.tfplan             | grep -E '^Plan:|will be created|will be destroyed|will be updated in-place|must be replaced|has moved'             >> "$GITHUB_STEP_SUMMARY" || true

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Staging Plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-staging-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staging.tfplan
          retention-days: 1

  prod-plan:
    name: Terraform Prod Plan
    runs-on: ubuntu-latest
    needs: terraform-checks

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'prod'

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_WORKSPACE: prod
      TF_VAR_environment: prod
      TF_VAR_instance_name: terraform-prod-vm
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_PLAN_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Prod Plan
        run: |
          if [ "${{ inputs.destructive_test }}" = "true" ]; then
            echo "Running SAFE destructive-plan test."

            terraform plan \
              -input=false \
              -no-color \
              -replace='google_compute_firewall.dynamic_demo' \
              -out=prod.tfplan
          else
            terraform plan \
              -input=false \
              -no-color \
              -lock-timeout=5m \
              -out=prod.tfplan
          fi

      - name: Enforce Production Security Policy
        run: |
          terraform show -json prod.tfplan > prod-policy-plan.json

          PUBLIC_IP_COUNT=$(jq '
            [
              .planned_values.root_module.child_modules[]?.resources[]?
              | select(.type == "google_compute_instance")
              | .values.network_interface[]?
              | .access_config[]?
            ]
            | length
          ' prod-policy-plan.json)

          if [ "$PUBLIC_IP_COUNT" -gt 0 ]; then
            echo "ERROR: Production VM has a public IP configuration."
            exit 1
          fi

          echo "Production policy passed: no public VM IP detected."

      - name: Enforce Production Deletion Protection
        run: |
          terraform show -json prod.tfplan > prod-deletion-policy.json

          UNPROTECTED=$(jq '
            [
              .planned_values.root_module.child_modules[]?.resources[]?
              | select(.type == "google_compute_instance")
              | select(.values.deletion_protection != true)
            ]
            | length
          ' prod-deletion-policy.json)

          if [ "$UNPROTECTED" -gt 0 ]; then
            echo "ERROR: Production VM deletion protection is not enabled."
            exit 1
          fi

          echo "Production policy passed: deletion protection enabled."

      - name: Enforce Production Naming Policy
        run: |
          terraform show -json prod.tfplan > prod-naming-policy.json

          INVALID_NAMES=$(jq '
            [
              .planned_values.root_module.resources[]?,
              .planned_values.root_module.child_modules[]?.resources[]?
              | select(.values.name? != null)
              | select((.values.name | contains("prod")) | not)
            ]
            | length
          ' prod-naming-policy.json)

          if [ "$INVALID_NAMES" -gt 0 ]; then
            echo "ERROR: Production resource name does not contain prod."
            exit 1
          fi

          echo "Production policy passed: resource naming is compliant."

      - name: Block Destructive Prod Changes
        run: |
          terraform show -json prod.tfplan > prod-plan.json

          if jq -e '
            [
              .resource_changes[]?
              | select(.change.actions | index("delete"))
            ]
            | length > 0
          ' prod-plan.json > /dev/null; then

            echo "Destructive Terraform actions detected in production plan."
            echo "Affected resources:"

            jq -r '
              .resource_changes[]?
              | select(.change.actions | index("delete"))
              | "\(.address) -> \(.change.actions | join(","))"
            ' prod-plan.json

            if [ "${{ inputs.destructive_test }}" = "true" ]; then
              echo "Explicit destructive production run approved via destructive_test=true."
            else
              echo "ERROR: Destructive production changes are blocked."
              exit 1
            fi
          else
            echo "No destructive production actions detected."
          fi

      - name: Upload Prod Plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-prod-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: prod.tfplan
          retention-days: 1

  dev-apply:
    name: Terraform Dev Apply
    runs-on: ubuntu-latest
    needs:
      - terraform-checks
      - dev-plan

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'dev'

    environment:
      name: dev-apply

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_environment: dev
      TF_VAR_instance_name: terraform-devops-vm
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Dev Workspace
        run: terraform workspace select default

      - name: Download Dev Plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: terraform-dev-plan-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Terraform Dev Apply
        run: terraform apply -input=false dev.tfplan

  prod-apply:
    name: Terraform Prod Apply
    runs-on: ubuntu-latest
    needs:
      - terraform-checks
      - prod-plan

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'prod'

    environment:
      name: prod-apply

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_WORKSPACE: prod
      TF_VAR_environment: prod
      TF_VAR_instance_name: terraform-prod-vm
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Prod Plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: terraform-prod-plan-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Terraform Prod Apply
        run: terraform apply -input=false prod.tfplan
